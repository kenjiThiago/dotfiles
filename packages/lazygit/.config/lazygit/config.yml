# As cores vêm do colors.yml gerado, juntado a este pelo LG_CONFIG_FILE.
gui:
  language: "en"
  border: "rounded"

promptToReturnFromSubprocess: false

os:
  editPreset: 'custom'
  edit: 'tmux-nvim-edit {{filename}}'
  editAtLine: 'tmux-nvim-edit {{filename}} {{line}}'
  editAtLineAndWait: 'tmux-nvim-edit {{filename}} {{line}}'
