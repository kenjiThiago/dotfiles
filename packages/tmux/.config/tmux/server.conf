# Ajustes de qualquer máquina do perfil server. Lido pelo if-shell do
# .tmux.conf, depois do colors.conf gerado e antes do .tmux.conf.local, que
# continua sendo o lugar do que é de uma máquina só.
#
# Tudo aqui existe por causa do tmux aninhado: no ssh há um tmux local e um
# remoto disputando o mesmo teclado, e quem recebe a tecla primeiro é o de fora.

# ── Prefixo ───────────────────────────────────────────────────────────────────
# Diferente do C-Space local, senão o prefixo nunca chega aqui dentro. O
# send-prefix devolve o C-a literal, que no bash é o começo da linha, por C-a C-a.
set -g prefix C-a
bind-key C-a send-prefix

# ── Binds que no desktop não usam prefixo ─────────────────────────────────────
# Os -n do .tmux.conf estão mortos aqui: o tmux de fora captura M-H, C-M-h e
# companhia antes, e o de dentro nunca os vê. As mesmas ações passam a exigir o
# prefixo, mantendo as letras do desktop.
#
# Isto sobrepõe, de propósito, seis teclas que já tinham dono: k (kill-session
# da scratch), l (last-window), n e p (next/previous-window), L (switch-client
# -l) e D (choose-client). No servidor a navegação por posição vale mais.
bind-key H select-pane -L
bind-key K select-pane -U
bind-key J select-pane -D
bind-key L select-pane -R

bind-key S split-window -v -c "#{pane_current_path}"
bind-key D split-window -h -c "#{pane_current_path}"

bind-key h select-window -t :=1
bind-key j select-window -t :=2
bind-key k select-window -t :=3
bind-key l select-window -t :=4

bind-key p switch-client -p
bind-key n switch-client -n

bind-key Z resize-pane -Z

# ── Barra ─────────────────────────────────────────────────────────────────────
# O host e a sessão à esquerda: no ssh é o que distingue as duas barras.
set -g status-left " #h  [#S] "

# As cores da faixa saem do `theme set`, como as do colors.conf. Ficam num
# gerado à parte porque repetir a paleta aqui a deixaria presa no tema da época.
source-file -q ~/.config/tmux/server-colors.conf
