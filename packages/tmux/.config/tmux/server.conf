# Perfil server. No ssh há um tmux local e um remoto disputando o teclado, e o de
# fora recebe a tecla primeiro.

# C-a para não colidir com o C-Space local; C-a C-a envia o C-a literal.
set -g prefix C-a
bind-key C-a send-prefix

# Os binds -n do .tmux.conf são capturados pelo tmux de fora, então aqui as mesmas
# ações usam prefixo. Sobrepõe de propósito k, l, n, p, L e D.
bind-key H select-pane -L
bind-key K select-pane -U
bind-key J select-pane -D
bind-key L select-pane -R

bind-key S split-window -v -c "#{pane_current_path}"
bind-key D split-window -h -c "#{pane_current_path}"

bind-key h select-window -t :=1
bind-key j select-window -t :=2
bind-key k select-window -t :=3
bind-key l select-window -t :=4

bind-key p switch-client -p
bind-key n switch-client -n
bind-key O switch-client -l

bind-key Z resize-pane -Z

# Reserva sem cores; o server-colors.conf, gerado pelo `theme set`, troca por uma com o host em bloco.
set -g status-left " #h  #S  "

source-file -q ~/.config/tmux/server-colors.conf
