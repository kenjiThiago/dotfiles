unbind r
bind r source-file ~/.tmux.conf
bind R run-shell "tmux-respawn"

# O histórico no nvim, num popup por cima: o painel não perde largura e o texto não se
# reorganiza. Sem -t, o capture-pane pega o painel embaixo (o popup não expande #{}).
# O -J junta as linhas quebradas, mas mantém os espaços do fim de cada uma.
bind-key \{ display-popup -w 100% -h 100% -E "tmux capture-pane -pJ -S - | sed 's/[[:space:]]*$//' | nvim -R + -"

set-option -sg escape-time 10
set-option -g focus-events on
set -g set-clipboard on

set -g prefix C-Space
set -g base-index 1
set -g detach-on-destroy off
set -g renumber-windows on
set -g status-interval 1
set -g history-limit 50000
# Da 3.8 em diante o padrão é on; com ele o tmux captura os cliques e o Ghostty não abre links.
set -g mouse off

# Só no desktop, que tem Wayland. O --type impede o wl-copy de adivinhar o tipo pelo
# conteúdo: um texto que começa com "  ●" viraria application/x-dtsz e não colaria.
if-shell "command -v wl-copy" 'set -s copy-command "wl-copy --type text/plain"'

setw -g mode-keys vi
set -g status-keys vi

bind-key -n M-H select-pane -L
bind-key -n M-K select-pane -U
bind-key -n M-J select-pane -D
bind-key -n M-L select-pane -R

bind-key v set -g status

bind-key -n M-S split-window -v -c "#{pane_current_path}"
bind-key -n M-D split-window -h -c "#{pane_current_path}"

# O -y dispensa a confirmação do x/X do tree mode e só existe da 3.6 em diante.
# Voltamos para o -Zs para mostrar apenas a árvore de sessões, sem expandir as janelas.
%if "#{>=:#{version},3.6}"
bind-key s choose-tree -Zs -y
%else
bind-key s choose-tree -Zs
%endif

# O run-shell não tem terminal para o fzf, então um popup hospeda o script;
# o -e avisa que ele já é popup.
bind-key f display-popup -w 50% -h 50% -e TMUX_SESSIONIZER_POPUP=1 \
  -E "~/.local/bin/tmux-sessionizer"

bind-key -n C-M-h select-window -t :=1
bind-key -n C-M-j select-window -t :=2
bind-key -n C-M-k select-window -t :=3
bind-key -n C-M-l select-window -t :=4

bind-key k run-shell 'tmux-popup -k'

bind-key -n C-M-p run-shell 'tmux-trocar-sessao -p "#{client_name}" "#{session_name}"'
bind-key -n C-M-n run-shell 'tmux-trocar-sessao -n "#{client_name}" "#{session_name}"'
bind-key -n C-M-o switch-client -l

bind-key -n M-Z resize-pane -Z

bind-key -n C-M-s display-popup -E "tmux list-sessions -F '#{session_last_attached} #S' | sort -rn | cut -d' ' -f2- | grep -v '^scratch-' | grep -vx \"$(tmux display-message -p '#S')\" | fzf --reverse | xargs tmux switch-client -t"
bind-key P run-shell 'tmux-popup -c "#{client_name}" -s "#{session_name}" -d "#{pane_current_path}" -w 80% -h 80% py python'
if-shell "command -v zsh && command -v testar-cor" \
  "bind-key H run-shell 'tmux-popup -c \"#{client_name}\" -s \"#{session_name}\" -d \"#{pane_current_path}\" -w 50% -h 40% -T \" Cores \" cor \"zsh -ic testar-cor\"'"
bind-key -n M-O run-shell 'tmux-popup -c "#{client_name}" -s "#{session_name}" -d "#{pane_current_path}" shell'
bind-key g run-shell 'tmux-lazygit -c "#{client_name}" -s "#{session_name}" -d "#{pane_current_path}"'

bind c run-shell 'tmux-popup -R' \; new-window -c "#{pane_current_path}"

set -g @plugin 'tmux-plugins/tpm'

if-shell "[ -x ~/.tmux/plugins/tpm/tpm ]" "run '~/.tmux/plugins/tpm/tpm'"

set-option -g status-position top
set -g status-left-length 50
# Os popups guardados agora são janelas da sessão atual. Mostramos pelo nome curto (ex: "lg").
set -g @popups '#{W:#{?#{m/r:^_scratch_.*_$,#{window_name}}, #{s/^_scratch_([^_]+)_$/\1/:window_name},}} '
set -g status-right "#{E:@popups}"

# Formatação das abas: se a janela começar com _scratch_, desenha VAZIO (oculta da barra).
# Caso contrário, desenha normal.
set -g window-status-format "#{?#{m:_scratch_*,#{window_name}},,#I:#W#{?window_zoomed_flag, Z,}}"
set -g window-status-current-format "#{?#{m:_scratch_*,#{window_name}},,#I:#W#{?window_zoomed_flag, Z,}}"

# Gerado pelo `theme set`; o -q cobre o caso de ainda não existir.
source-file -q ~/.config/tmux/colors.conf

if-shell '[ "${DOTFILES_PROFILE:-$(cat ~/.local/state/dotfiles/profile 2>/dev/null)}" = server ]' \
  'source-file -q ~/.config/tmux/server.conf'

# Ajustes de uma máquina só, não versionados.
source-file -q ~/.tmux.conf.local
