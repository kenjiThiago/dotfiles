unbind r
bind r source-file ~/.tmux.conf

# unbind [
bind-key \{ run-shell "tmux-relative-numbers"

#settings
set-option -sg escape-time 10
set-option -g focus-events on
set -g set-clipboard on

set -g prefix C-Space
set -g base-index 1
set -g detach-on-destroy off
set -g renumber-windows on
set -g status-interval 1

# Wayland só existe no desktop; no servidor o copy-command fica no padrão e o
# copy-mode continua funcionando dentro do tmux.
if-shell "command -v wl-copy" 'set -s copy-command "wl-copy"'

setw -g mode-keys vi
set -g status-keys vi

#binds
bind-key -n M-H select-pane -L
bind-key -n M-K select-pane -U
bind-key -n M-J select-pane -D
bind-key -n M-L select-pane -R

bind-key v set -g status

bind-key -n M-S split-window -v -c "#{pane_current_path}"
bind-key -n M-D split-window -h -c "#{pane_current_path}"

bind-key s choose-tree -Zs -y

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

bind-key -n C-M-h select-window -t :=1
bind-key -n C-M-j select-window -t :=2
bind-key -n C-M-k select-window -t :=3
bind-key -n C-M-l select-window -t :=4

bind-key k run-shell "tmux detach-client -s scratch 2>/dev/null; tmux kill-session -t scratch 2>/dev/null || true"

bind-key -n C-M-p switch-client -p
bind-key -n C-M-n switch-client -n

bind-key -n M-Z resize-pane -Z

bind-key -n C-M-s display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind-key P display-popup -w 80% -h 80% -d "#{pane_current_path}" -E "tmux new-session -d -s scratch-py python 2>/dev/null ; tmux set-option -t scratch-py status off ; tmux set-option -t scratch-py detach-on-destroy on ; tmux attach-session -t scratch-py"
if-shell "command -v zsh && command -v testar-cor" \
  'bind-key H display-popup -w 50% -h 40% -T " Cores " -d "#{pane_current_path}" -E "tmux new-session -d -s scratch-cor \"zsh -ic testar-cor\" 2>/dev/null ; tmux set-option -t scratch-cor status off ; tmux set-option -t scratch-cor detach-on-destroy on ; tmux attach-session -t scratch-cor"'
bind-key -n M-O display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% \
  -E "tmux"
bind-key -r g run-shell "tmux-lazygit"

# bind-key  -T copy-mode-vi  j  send-keys  -X  cursor-up
# bind-key  -T copy-mode-vi  k  send-keys  -X  cursor-down

bind c new-window -c "#{pane_current_path}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

# O install.sh só clona o tpm no perfil desktop.
if-shell "[ -x ~/.tmux/plugins/tpm/tpm ]" "run '~/.tmux/plugins/tpm/tpm'"

# set -g status off
set-option -g status-position top
set -g status-left-length 50

# As cores vêm do `theme set`. O -q cala a boca antes do primeiro, quando o
# arquivo ainda não existe: aí o tmux sobe com as cores padrão.
source-file -q ~/.config/tmux/colors.conf

# Ajustes de uma máquina só (prefix diferente, status, o que for). Não é
# versionado: se o arquivo não existir, o -q cala a boca.
source-file -q ~/.tmux.conf.local
