# conf/colors.conf é gerado por `theme set` (cores, $shadow e $wallpaper).
source = $HOME/.config/hypr/conf/colors.conf

$font = Hack Nerd Font

general {
    disable_loading_bar = true
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $wallpaper
    color = $base

    # Escurecido para o texto ter contraste com qualquer wallpaper.
    blur_passes = 3
    blur_size = 8
    brightness = 0.7
    contrast = 0.9
    noise = 0.011
}

label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%H:%M")"
    color = $text
    font_size = 72
    font_family = $font

    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow

    position = 0, 140
    halign = center
    valign = center
}

# O formato depende de LC_TIME; com pt_BR sai "segunda-feira, 25 de julho".
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d de %B")"
    color = $subtle
    font_size = 16
    font_family = $font

    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow

    position = 0, 68
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $text
    font_size = 14
    font_family = $font

    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow

    position = 0, -24
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    rounding = 10
    outline_thickness = 2
    font_family = $font

    outer_color = $overlay
    inner_color = $surface
    font_color = $text
    check_color = $accent
    fail_color = $error
    capslock_color = $warning

    # Fração da altura do campo. O hyprlock aceita de 0.2 a 0.8.
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    fade_on_empty = false
    placeholder_text = <span foreground="##$textAlpha">Senha</span>
    fail_text = <span foreground="##$textAlpha">$FAIL <b>($ATTEMPTS)</b></span>
    hide_input = false

    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow

    position = 0, -84
    halign = center
    valign = center
}
