# conf/colors.conf é gerado por `theme set` (cores, $shadow e $wallpaper).
source = $HOME/.config/hypr/conf/colors.conf

$font = Hack Nerd Font

# O bloco central vai de +230 (topo do relógio) a -180 (base do campo). As
# posições abaixo deslocam a pilha cerca de 70px acima do centro geométrico,
# que é onde ela é percebida como centralizada.

general {
    disable_loading_bar = true
    hide_cursor = true
    ignore_empty_input = true
}

# ── Fundo ─────────────────────────────────────────────────────────────────────
background {
    monitor =
    path = $wallpaper
    color = $base

    # Mesmo blur das janelas (ver conf/appearance.lua), escurecido para o
    # texto ter contraste com qualquer wallpaper.
    blur_passes = 3
    blur_size = 8
    brightness = 0.7
    contrast = 0.9
    noise = 0.011
}

# ── Relógio ───────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:30000] echo "$(date +"%H:%M")"
    color = $text
    font_size = 96
    font_family = $font

    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow

    position = 0, 180
    halign = center
    valign = center
}

# ── Data ──────────────────────────────────────────────────────────────────────
# O formato depende de LC_TIME; com pt_BR sai "segunda-feira, 25 de julho".
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d de %B")"
    color = $subtle
    font_size = 20
    font_family = $font

    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow

    position = 0, 90
    halign = center
    valign = center
}

# ── Avatar ────────────────────────────────────────────────────────────────────
image {
    monitor =
    path = ~/.config/hypr/face.png
    size = 110
    rounding = -1
    border_size = 2
    border_color = $accent

    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow

    position = 0, -40
    halign = center
    valign = center
}

# ── Campo de senha ────────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 320, 56
    rounding = -1
    outline_thickness = 2

    outer_color = $accent
    inner_color = $surface
    font_color = $text
    check_color = $accentAlt
    fail_color = $red
    capslock_color = $yellow

    # Fração da altura do campo. O hyprlock aceita de 0.2 a 0.8.
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    fade_on_empty = false
    placeholder_text = <span foreground="##$mutedAlpha">$USER</span>
    fail_text = <span foreground="##$textAlpha">$FAIL <b>($ATTEMPTS)</b></span>
    hide_input = false

    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow

    position = 0, -150
    halign = center
    valign = center
}
